[workspace]
members = [".", "mecab_rs_build"]
exclude = ["compare"]

[package]
name = "mecab_rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "BSD-3-Clause"
description = "A native Rust port of the MeCab analyzer: reads MeCab binary dictionaries, best path, constraints and N-best"
readme = "README.md"
keywords = ["mecab", "japanese", "morphological-analysis", "tokenizer", "nlp"]
categories = ["text-processing"]
include = ["src/", "README.md", "LICENSE", "Cargo.toml"]

[dependencies]
memmap2 = "0.9"
lzma-rust2 = { version = "0.24", default-features = false, features = [
    "std",
    "optimization",
    "xz",
], optional = true }

[features]
default = ["xz"]
xz = ["dep:lzma-rust2"]
pair-stats = []

[profile.release]
incremental = true

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
inline_always = "allow"
similar_names = "allow"
many_single_char_names = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
allow_attributes_without_reason = "warn"

[lints]
workspace = true
