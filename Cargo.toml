[workspace]
members = [".", "mecab_rs_tools"]
exclude = ["compare"]

[package]
name = "mecab_rs"
version = "0.1.3"
edition = "2024"
license = "BSD-3-Clause"
description = "Japanese morphological analyzer in pure Rust: a MeCab port with byte-identical output, bundled UniDic and IPAdic, fast and memory-light"
readme = "README.md"
repository = "https://github.com/gembleman/mecab_rs"
keywords = ["mecab", "japanese", "morphology", "tokenizer", "nlp"]
categories = ["text-processing", "internationalization"]
include = ["src/", "README.md", "LICENSE", "Cargo.toml"]

[package.metadata.docs.rs]
features = ["unidic", "ipadic"]

[dependencies]
memmap2 = "0.9"
lzma-rust2 = { version = "0.25", default-features = false, features = [
    "std",
    "optimization",
    "xz",
], optional = true }
mecab_dict_unidic = { version = "0.1.0", optional = true }
mecab_dict_ipadic = { version = "0.1.0", optional = true }
dirs = { version = "6", optional = true }

[features]
default = ["xz"]
xz = ["dep:lzma-rust2"]
unidic = ["xz", "dep:mecab_dict_unidic", "dep:dirs"]
ipadic = ["xz", "dep:mecab_dict_ipadic", "dep:dirs"]
pair-stats = []

[profile.release]
incremental = true

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
inline_always = "allow"
similar_names = "allow"
many_single_char_names = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
allow_attributes_without_reason = "warn"

[lints]
workspace = true
